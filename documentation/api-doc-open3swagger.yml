openapi: 3.0.0
info:
  title: WattApp EV Charging API
  version: 1.0.0
  description: API for managing Electric Vehicle Charging Points, Reservations, Sessions, and Admin operations.
servers:
  - url: http://localhost:9876/api
    description: Local Development Server

# ------------------------------------------------------------------------------
# SECURITY SCHEMES
# ------------------------------------------------------------------------------
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-OBSERVATORY-AUTH

  schemas:
    # Reusable Point Object
    Point:
      type: object
      properties:
        pointid:
          type: string
        providerName:
          type: string
        lon:
          type: number
        lat:
          type: number
        status:
          type: string
          enum: [available, charging, reserved, malfunction, offline]
        cap:
          type: number
        kwhprice:
          type: number

    # Standard Error Response
    ErrorResponse:
      type: object
      properties:
        call:
          type: string
        timeref:
          type: string
        originator:
          type: string
        return_code:
          type: integer
        error:
          type: string
        debuginfo:
          type: string


paths:

  # ==============================
  # AUTHENTICATION
  # ==============================
  /auth/signup:
      post:
        summary: Register a new user
        tags: [Auth]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [full_name, email, password]
                properties:
                  full_name:
                    type: string
                    example: "Dimitris Christou"
                    description: "Full name (First and Last name separated by space)"
                  email:
                    type: string
                    format: email
                    example: "dimitris@wattapp.com"
                  password:
                    type: string
                    format: password
                    example: "secret123"
                  phone:
                    type: string
                    example: "+306912345678"
        responses:
          '200':
            description: User created successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: "OK"
                    message:
                      type: string
                      example: "User created successfully"
                    userId:
                      type: string
                      example: "65b9dc7d6902b282a0"
          '400':
            description: Missing required fields/invalid name format/email already in use

  /auth/login:
    post:
      summary: Login and receive an authentication token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  message:
                    type: string  
                    example: "Login successful"
                  token:
                    type: string
                    description: The JWT or Session token
                  email:
                    type: string 
                    example: "newuser@wattapp.com"
        '400':
          description: Invalid credentials

  /auth/logout:
      post:
        summary: Logout user (invalidate session token)
        tags: [Auth]
        parameters:
          - in: header
            name: X-OBSERVATORY-AUTH
            schema:
              type: string
            required: true
            description: Session token received from login
        responses:
          '200':
            description: Logged out successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string
                      example: "OK"
                    message:
                      type: string
                      example: "Logged out successfully"
          '400':
            description: Missing Authentication Token
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Server Error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

  # ==============================
  # ADMIN OPERATIONS
  # ==============================
  /admin/healthcheck:
    get:
      summary: Check system and database health
      tags: [Admin]
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  dbconnection:
                    type: string
        '500':
          description: Database connection failed

  /admin/resetpoints:
    post:
      summary: Reset the points database to default values
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Database reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
        '500':
          description: Reset failed

  /admin/addpoints:
    post:
      summary: Import new points from a CSV file
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                source:
                  type: string
                  format: binary
                  description: The CSV file containing point data
      responses:
        '200':
          description: Points imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  imported_count:
                    type: integer
        '400':
          description: Invalid file format or missing file

  # ==============================
  # POINTS OPERATIONS
  # ==============================
  /points:
    get:
      summary: Get list of points (optionally filtered by status)
      tags: [Points]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [available, charging, reserved, malfunction, offline]
          description: Filter points by current status
      responses:
        '200':
          description: List of points retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '401':
          description: Invalid status parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /point/{id}:
    get:
      summary: Get details of a specific point
      tags: [Points]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the charging point
      responses:
        '200':
          description: Point details found
          content:
            application/json:
              schema:
                type: object
                properties:
                  pointid:
                    type: string
                  lon:
                    type: number
                  lat:
                    type: number
                  status:
                    type: string
                  cap:
                    type: number
                  reservationendtime:
                    type: string
                  kwhprice:
                    type: number
        '404':
          description: Point not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /updpoint/{id}:
    put:
      summary: Update point status or price (Admin/Operator)
      tags: [Points]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, charging, reserved, malfunction, offline]
                kwhprice:
                  type: number
      responses:
        '200':
          description: Point updated successfully
        '400':
          description: Invalid status or price format
        '404':
          description: Point not found

  /pointstatus/{pointid}/{from}/{to}:
    get:
      summary: Get history of status changes for a point
      tags: [Points]
      parameters:
        - in: path
          name: pointid
          required: true
          schema:
            type: string
        - in: path
          name: from
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Start date (YYYYMMDD)
        - in: path
          name: to
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: End date (YYYYMMDD)
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: Response format
      responses:
        '200':
          description: Status history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
            text/csv:
              schema:
                type: string
        '204':
          description: No history found for this period
        '400':
          description: Invalid date range or format
        '404':
          description: Point not found

  # ==============================
  # RESERVATIONS
  # ==============================
  /reserve/{id}/{minutes}:
    post:
      summary: Reserve a charging point
      tags: [Reservations]
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: minutes
          required: true
          schema:
            type: integer
            default: 30
            maximum: 60
          description: Duration of reservation in minutes
      responses:
        '200':
          description: Reservation successful
        '400':
          description: Point is not available for reservation
        '404':
          description: Point not found

  /activeres:
    get:
      summary: Get the active reservation for the logged-in user
      tags: [Reservations]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Active reservation found
          content:
            application/json:
              schema:
                type: object
                properties:
                  pointid:
                    type: string
                  reservationendtime:
                    type: string
        '204':
          description: No active reservation found (Empty Body)

    delete:
      summary: Cancel the active reservation for the logged-in user
      tags: [Reservations]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Reservation cancelled successfully
        '400':
          description: No active reservation to cancel

  # ==============================
  # SESSIONS
  # ==============================
  /sessions:
    post:
      summary: Record a new charging session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pointid, starttime, endtime, startsoc, endsoc, totalkwh, kwhprice, amount]
              properties:
                pointid:
                  type: string
                starttime:
                  type: string
                endtime:
                  type: string
                startsoc:
                  type: number
                endsoc:
                  type: number
                totalkwh:
                  type: number
                kwhprice:
                  type: number
                amount:
                  type: number
      responses:
        '200':
          description: Session recorded successfully
        '400':
          description: Missing fields or invalid values
        '404':
          description: Point not found

  /sessions/{id}/{from}/{to}:
    get:
      summary: Get sessions for a point within a date range
      tags: [Sessions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: from
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
        - in: path
          name: to
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
      responses:
        '200':
          description: List of sessions found
        '204':
          description: No sessions found for this period
        '400':
          description: Invalid date format
        '404':
          description: Point not found

  # ==============================
  # NAVIGATION
  # ==============================
  /navigate/{pointId}:
    get:
      summary: Redirect to Google Maps navigation
      tags: [Navigation]
      parameters:
        - in: path
          name: pointId
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirects to Google Maps URL
        '404':
          description: Point not found