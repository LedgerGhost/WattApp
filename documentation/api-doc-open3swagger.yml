openapi: 3.0.0
info:
  title: WattApp EV Charging API
  version: 1.0.0
  description: API for managing Electric Vehicle Charging Points, Reservations, Sessions, and Admin operations.

servers:
  - url: http://localhost:9876/api
    description: Local Development Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-OBSERVATORY-AUTH

  schemas:
    Point:
      type: object
      properties:
        pointid:
          type: string
        providerName:
          type: string
        lon:
          type: number
        lat:
          type: number
        status:
          type: string
          enum: [available, charging, reserved, malfunction, offline]
        cap:
          type: number
        kwhprice:
          type: number

    PointInfo:
      allOf:
        - $ref: '#/components/schemas/Point'
        - type: object
          properties:
            station_name:
              type: string
              nullable: true
            connector_type:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      properties:
        call:
          type: string
        timeref:
          type: string
        originator:
          type: string
        return_code:
          type: integer
        error:
          type: string
        debuginfo:
          type: string

paths:

  # ==============================
  # AUTHENTICATION
  # ==============================
  /auth/signup:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: User created successfully
        '400':
          description: Invalid input

  /auth/login:
    post:
      summary: Login and receive an authentication token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '400':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Logged out successfully
        '400':
          description: Missing token

  # ==============================
  # ADMIN
  # ==============================
  /admin/healthcheck:
    get:
      summary: Check system health
      tags: [Admin]
      responses:
        '200':
          description: OK

  /admin/resetpoints:
    post:
      summary: Reset points database
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Reset completed

  /admin/addpoints:
    post:
      summary: Import points from CSV
      tags: [Admin]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                source:
                  type: string
                  format: binary
      responses:
        '200':
          description: Points imported

  # ==============================
  # POINTS
  # ==============================
  /points:
    get:
      summary: Get list of points
      tags: [Points]
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
            default: json
      responses:
        '200':
          description: Points list

  /pointsinfo:
    get:
      summary: Get list of points with extra info
      tags: [Points]
      responses:
        '200':
          description: Points info list

  /point/{id}:
    get:
      summary: Get point details
      tags: [Points]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Point details
        '404':
          description: Point not found

  /updpoint/{id}:
    post:
      summary: Update point
      tags: [Points]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated

  /pointstatus/{pointid}/{from}/{to}:
    get:
      summary: Get point status history
      tags: [Points]
      parameters:
        - in: path
          name: pointid
          required: true
          schema:
            type: integer
        - in: path
          name: from
          required: true
          schema:
            type: string
        - in: path
          name: to
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status history

  # ==============================
  # RESERVATIONS
  # ==============================
  /reserve/{id}:
    post:
      summary: Reserve a charging point (default 30 minutes)
      tags:
        - Reservations
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reservation result (success OR point not available)
        '400':
          description: Invalid point id
        '404':
          description: Point not found
        '409':
          description: User already has an active reservation

  /reserve/{id}/{minutes}:
    post:
      summary: Reserve a charging point for a specific duration
      tags:
        - Reservations
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: minutes
          required: true
          schema:
            type: integer
            minimum: 1
            default: 30
            maximum: 60
      responses:
        '200':
          description: Reservation result (success OR point not available)
        '400':
          description: Invalid point id
        '404':
          description: Point not found
        '409':
          description: User already has an active reservation

  # ==============================
  # SESSIONS
  # ==============================
  /newsession:
    post:
      summary: Record a new charging session
      tags: [Sessions]
      responses:
        '200':
          description: Session recorded

  /sessions/{id}/{from}/{to}:
    get:
      summary: Get sessions for a point
      tags: [Sessions]
      responses:
        '200':
          description: Sessions list

  # ==============================
  # NAVIGATION
  # ==============================
  /navigate/{pointId}:
    get:
      summary: Navigate to charging point
      tags: [Navigation]
      parameters:
        - in: path
          name: pointId
          required: true
          schema:
            type: integer
      responses:
        '302':
          description: Redirect
